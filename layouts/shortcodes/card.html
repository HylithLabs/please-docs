<div class="col">
  <div class="card h-100 border shadow-sm rounded-3">
    <div class="card-body">
      <h5 class="card-title">
        <a href="{{ .Get "link" }}" class="stretched-link text-decoration-none text-reset">{{ .Get "title" }}</a>
      </h5>
      {{ with .Get "subtitle" }}
      <p class="card-text text-muted small mb-0">{{ . }}</p>
      {{ end }}
      {{ with .Inner }}{{ . }}{{ end }}
    </div>
  </div>
</div>
